<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>丸移動</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#000;max-width:100vw;max-height:100vh;width:auto;height:auto;object-fit:contain}
#stick{position:fixed;right:30px;bottom:30px;width:120px;height:120px;border-radius:50%;background:#fff2;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:#fff5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stick"><div id="knob"></div></div>
<script>
// move.ts の固定値と同じ (w,h,r は変化しないので毎回は送られてこない)
const W = 400, H = 400, R = 20;

const cv = document.getElementById('c');
cv.width = W;
cv.height = H;
const ctx = cv.getContext('2d');

// move.ts から届く "cx,cy,tx,ty" をそのまま描画するだけ
new EventSource('/events').onmessage = e => {
  const [x, y, tx, ty] = e.data.split(',');
  ctx.clearRect(0, 0, W, H);

  ctx.beginPath();
  ctx.arc(+tx, +ty, R, 0, Math.PI * 2);
  ctx.fillStyle = '#ff5252';
  ctx.fill();

  ctx.beginPath();
  ctx.arc(+x, +y, R, 0, Math.PI * 2);
  ctx.fillStyle = '#4fc3f7';
  ctx.fill();
};

// 押している上下左右キーの組み合わせを 0~7 の1コードに変換して move.ts に送るだけ
const held = new Set();
const keyToDir = {
  arrowup: 'up', w: 'up',
  arrowdown: 'down', s: 'down',
  arrowleft: 'left', a: 'left',
  arrowright: 'right', d: 'right',
};

addEventListener('keydown', e => {
  const d = keyToDir[e.key.toLowerCase()];
  if (d) held.add(d);
});
addEventListener('keyup', e => {
  const d = keyToDir[e.key.toLowerCase()];
  if (d) held.delete(d);
});
addEventListener('blur', () => held.clear());

// 0:上 1:下 2:左 3:右 4:左上 5:右上 6:左下 7:右下
const codeTable = {
  '-1,0': '0', '1,0': '1', '0,-1': '2', '0,1': '3',
  '-1,-1': '4', '-1,1': '5', '1,-1': '6', '1,1': '7',
};

const keyboardCode = () => {
  const v = held.has('up') === held.has('down') ? 0 : held.has('up') ? -1 : 1;
  const h = held.has('left') === held.has('right') ? 0 : held.has('left') ? -1 : 1;
  return codeTable[`${v},${h}`] ?? null;
};

// スマホ用スティック: つまんだ角度を一番近い8方向のコードに丸めるだけ
const stick = document.getElementById('stick');
const knob = document.getElementById('knob');
const DEAD_ZONE = 12, RADIUS = 45;
const angleToCode = ['3', '7', '1', '6', '2', '4', '0', '5'];

let center = null;
let joystickCode = null;

stick.addEventListener('pointerdown', e => {
  stick.setPointerCapture(e.pointerId);
  const rect = stick.getBoundingClientRect();
  center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
});

stick.addEventListener('pointermove', e => {
  if (!center) return;
  const dx = e.clientX - center.x;
  const dy = e.clientY - center.y;
  const dist = Math.hypot(dx, dy);

  const clamped = Math.min(dist, RADIUS);
  const angle = Math.atan2(dy, dx);
  knob.style.transform = `translate(${Math.cos(angle) * clamped}px, ${Math.sin(angle) * clamped}px)`;

  if (dist < DEAD_ZONE) {
    joystickCode = null;
    return;
  }
  const idx = (((Math.round(angle / (Math.PI / 4))) % 8) + 8) % 8;
  joystickCode = angleToCode[idx];
});

const releaseStick = () => {
  center = null;
  joystickCode = null;
  knob.style.transform = 'translate(0, 0)';
};
stick.addEventListener('pointerup', releaseStick);
stick.addEventListener('pointercancel', releaseStick);

setInterval(() => {
  const code = joystickCode ?? keyboardCode();
  if (code !== null) fetch('/move', { method: 'POST', body: code });
}, 50);
</script>
</body>
</html>
